name: Mirror CI
run-name: Mirror CI ${{ github.sha }}
'on':
  push:
    branches-ignore:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Go verify with TimescaleDB
    if: github.repository == 'subculture-collective/headcount'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: timescale/timescaledb:latest-pg17@sha256:b346edcdb51a1fd6020e3965e0bd1c9f3406fa6d5fbce1e28f4852587ef934e2
        env:
          POSTGRES_USER: headcount_test
          POSTGRES_PASSWORD: headcount_test
          POSTGRES_DB: headcount_test
          TIMESCALEDB_TELEMETRY: 'off'
          TS_TUNE_MEMORY: 1GB
          TS_TUNE_NUM_CPUS: '2'
        ports:
        - 5432:5432
        options: >-
          --health-cmd "pg_isready -U headcount_test -d headcount_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Hosted runners reach service containers through the published loopback port.
      HEADCOUNT_TEST_DATABASE_URL: postgres://headcount_test:headcount_test@127.0.0.1:5432/headcount_test?sslmode=disable
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: go.sum
    - name: Confirm the disposable database answers on loopback
      run: pg_isready -h 127.0.0.1 -p 5432 -U headcount_test -d headcount_test -t 30
    - name: Verify modules
      run: go mod verify
    - name: Native admission guard regression tests
      run: python3 scripts/test-predeploy-ci.py
    - name: Vet
      run: go vet ./...
    - name: Unit and database integration tests
      # Isolated test databases still share the cluster-wide API role.
      run: go test -p 1 -race -count=1 -timeout=10m ./...
    - name: Build all commands
      run: go build ./cmd/...
  image:
    name: API image qualification
    if: github.repository == 'subculture-collective/headcount'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_REVISION: ${{ github.sha }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Pull the pinned TimescaleDB image used by the image check
      # The check gives each docker command 45 seconds, so the pull happens first.
      shell: bash
      run: |
        set -euo pipefail
        image=$(python3 -c "import re, pathlib; print(re.search(r\"^POSTGRES = '([^']+)'\", pathlib.Path('scripts/check-ci-image.py').read_text(), re.M)[1])")
        docker pull --quiet "$image"
    - name: Build and qualify the API image
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
        image="headcount-mirror-ci/api:$SOURCE_REVISION"
        docker build --build-arg "SOURCE_REVISION=$SOURCE_REVISION" \
          --label "org.opencontainers.image.revision=$SOURCE_REVISION" \
          --label "org.opencontainers.image.source=https://git.subcult.tv/subculture-collective/headcount" \
          -t "$image" .
        python3 scripts/check-ci-image.py "$image" "$SOURCE_REVISION"
  mirror-gate:
    name: Mirror CI gate
    if: always() && github.repository == 'subculture-collective/headcount'
    needs:
    - verify
    - image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Require every verification job
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PY'
        import json, os
        results = json.loads(os.environ["RESULTS"])
        expected = {'verify', 'image'}
        assert set(results) == expected, results
        for name, result in results.items():
            assert result["result"] == "success", name + " did not pass"
        PY
