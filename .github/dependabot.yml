version: 2

# Ready pull requests in this organization merge themselves once checks pass,
# and a merge to main deploys the dashboard API. So every ecosystem ignores
# major updates, groups minor and patch updates into one pull request and keeps
# at most two pull requests open. The Dockerfile base images (golang, alpine)
# carry no patch version, so they are bumped by hand with go.mod.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
